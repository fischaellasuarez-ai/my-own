<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>History - UN Month</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css">
</head>


<body class="history-page">


    <!-- =====================================================
         VIDEO BACKGROUND
         Change history-bg.mp4 to the name of your video
         ===================================================== -->

    <video class="history-video-background"
           autoplay
           muted
           loop
           playsinline
           aria-hidden="true">

        <source src="images/UN-BG.mp4" type="video/mp4">

    </video>


    <!-- =====================================================
         DARK / PURPLE OVERLAY
         Makes the content easier to see over the video
         ===================================================== -->

    <div class="history-video-overlay"></div>



    <!-- =====================================================
         NAVIGATION
         ===================================================== -->

    <div class="nav">

        <button onclick="location.href='INFO.html'">
            PERSONAL INFORMATION
        </button>

        <button onclick="location.href='HABITS.html'">
            HOBBIES
        </button>

        <button onclick="location.href='PERSONALITY.html'">
            PERSONALITY
        </button>

        <button class="active" aria-current="page">
            HISTORY
        </button>

    </div>



    <!-- =====================================================
         UN MONTH POSTER
         ===================================================== -->

    <section class="un-poster">


        <!-- Decorative Top Line -->

        <div class="un-top-line"></div>



        <!-- =================================================
             MAIN TITLE
             ================================================= -->

        <div class="un-heading">

            <p class="un-small-title">
                UNITED NATIONS
            </p>

            <h1>
                UN MONTH
            </h1>

            <p class="un-subtitle">
                FOUNDING MEMBERS • 1945
            </p>

        </div>



        <!-- =================================================
             FLAGS
             ================================================= -->

        <div class="flag-layout">


            <!-- =============================================
                 UNITED STATES
                 ============================================= -->

            <article class="country-card country-usa">

                <div class="flag-circle">

                    <img src="images/UN_AMERICA.jpg"
                         alt="Flag of the United States">

                </div>


                <div class="country-information">

                    <h2>
                        UNITED STATES
                    </h2>

                    <p>
                        AUGUST 8, 1945
                    </p>

                </div>

            </article>



            <!-- =============================================
                 URUGUAY
                 ============================================= -->

            <article class="country-card country-uruguay">

                <div class="flag-circle">

                    <img src="images/UN_URUGUAY.jpg"
                         alt="Flag of Uruguay">

                </div>


                <div class="country-information">

                    <h2>
                        URUGUAY
                    </h2>

                    <p>
                        SEPTEMBER 18, 1945
                    </p>

                </div>

            </article>



            <!-- =============================================
                 FRANCE
                 ============================================= -->

            <article class="country-card country-france">

                <div class="flag-circle">

                    <img src="images/UN_FRANCE.jpg"
                         alt="Flag of France">

                </div>


                <div class="country-information">

                    <h2>
                        FRANCE
                    </h2>

                    <p>
                        AUGUST 31, 1945
                    </p>

                </div>

            </article>



            <!-- =============================================
                 DOMINICAN REPUBLIC
                 ============================================= -->

            <article class="country-card country-dominican">

                <div class="flag-circle">

                    <img src="images/UN_DOMINICAN.jpg"
                         alt="Flag of the Dominican Republic">

                </div>


                <div class="country-information">

                    <h2>
                        DOMINICAN REPUBLIC
                    </h2>

                    <p>
                        SEPTEMBER 4, 1945
                    </p>

                </div>

            </article>



            <!-- =============================================
                 NICARAGUA
                 ============================================= -->

            <article class="country-card country-nicaragua">

                <div class="flag-circle">

                    <img src="images/UN_NICARAGUA.jpg"
                         alt="Flag of Nicaragua">

                </div>


                <div class="country-information">

                    <h2>
                        NICARAGUA
                    </h2>

                    <p>
                        SEPTEMBER 6, 1945
                    </p>

                </div>

            </article>


        </div>



        <!-- =================================================
             BOTTOM DECORATION
             ================================================= -->

        <div class="un-bottom-decoration">

            <span></span>

            <p>
                PEACE • UNITY • COOPERATION
            </p>

            <span></span>

        </div>


    </section>



    <!-- =====================================================
         HOME BUTTON
         ===================================================== -->

    <a href="index.html"
       class="circle-button"
       aria-label="Go back to Home"
       title="Home">

        ←

    </a>


</body>

</html>
